services:
  web:
    build: ./apps/web
    env_file:
      - ./apps/web/.env
    ports:
      - "3031:3000"
    depends_on:
      - api

  api:
    build: ./apps/api
    env_file:
      - ./apps/api/.env
    ports:
      - "8007:8000"
    environment:
      - STORAGE_PATH=/app/storage
      - CORS_ORIGIN_REGEX=^https?://(localhost|127\\.0\\.0\\.1)(:\\d+)?$
      - COOKIE_SAMESITE=lax
      - COOKIE_SECURE=false
      - MAX_UPLOAD_BYTES=15728640
      - MAX_ZIP_FILES=1000
      - MAX_ZIP_UNCOMPRESSED_BYTES=104857600
      - MAX_ZIP_COMPRESSION_RATIO=100
      - MAX_EXTRACTION_FILES=25
      - RATE_LIMIT_AUTH_PER_MIN=20
      - RATE_LIMIT_UPLOAD_PER_MIN=30
      - RATE_LIMIT_GENERAL_PER_MIN=120
      - LOGIN_LOCKOUT_FAILURES=5
      - LOGIN_LOCKOUT_SECONDS=900
      - LOGIN_REPEATED_LOCKOUT_SECONDS=3600
      - LOGIN_ATTEMPT_TTL_SECONDS=86400
      - RETENTION_EDITOR_DRAFTS_DAYS=30
      - RETENTION_SPREADSHEETS_DAYS=180
      - RETENTION_REPORTS_DAYS=365
      - RETENTION_TEMP_FILES_DAYS=7
      - ALLOW_AI_EXTRACTION=true
      - MAX_IA_INPUT_CHARS=20000
      - MAX_IA_FIELDS=80
      - MAINTENANCE_TOKEN=dev-maintenance-token
    volumes:
      - ./storage:/app/storage

  nginx:
    image: nginx:alpine
    ports:
      - "82:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
